          cat > src/main/java/com/example/donutauction/Money.java <<'__END_10__'
          package com.example.donutauction;

          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class Money {
              private static final Pattern P = Pattern.compile("^\\$?(\\d[\\d,]*(?:\\.\\d+)?)\\s*([kmbKMB])?$");

              private Money() {}

              /** "1.5k" -> 1500. Returns NaN if it isn't a number. */
              public static double parse(String s) {
                  if (s == null) return Double.NaN;
                  Matcher m = P.matcher(s.trim());
                  if (!m.matches()) return Double.NaN;
                  double v = Double.parseDouble(m.group(1).replace(",", ""));
                  String suf = m.group(2);
                  if (suf != null) {
                      switch (suf.toLowerCase(Locale.ROOT)) {
                          case "k" -> v *= 1_000;
                          case "m" -> v *= 1_000_000;
                          case "b" -> v *= 1_000_000_000;
                      }
                  }
                  return v;
              }

              public static String format(double v) {
                  if (v >= 1_000_000_000) return trim(v / 1_000_000_000) + "B";
                  if (v >= 1_000_000) return trim(v / 1_000_000) + "M";
                  if (v >= 1_000) return trim(v / 1_000) + "K";
                  return trim(v);
              }

              private static String trim(double v) {
                  String s = String.format(Locale.ROOT, "%.1f", v);
                  return s.endsWith(".0") ? s.substring(0, s.length() - 2) : s;
              }
          }
